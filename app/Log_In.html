    <!-- Allows a logged in user to create their own concert by detailing information about it -->
    <form id="form" class="container border border-3 p-5 rounded-5 needs-validation" novalidate>
        <div class="m-5">
            <h1 id="title">Log In</h1>
        </div>
        <h5>Email Address</h5>
        <div class="form-floating mb-3">
            <input type="name" class="form-control" id="floatingInput" placeholder="" required>
            <label for="floatingInput">email</label>
            <div class="invalid-feedback">
                Please enter an email
            </div>
        </div>
        <h5>Password</h5>
        <div class="form-floating mb-3">
            <input type="password" class="form-control" id="floatingInput" placeholder="" required>
            <label for="floatingInput">password</label>
            <div class="invalid-feedback">
                Please enter your password
            </div>
        </div>
        <div class="d-grid gap-2">
            <button class="btn btn-success btn-lg d-grid gap-2 m-4" role="button" type="submit">Log In</button>
        </div>

            <pre>
Don't have an account? <a href="Register.html">Register</a> now!
            </pre>

    </form>
    <script>
    (() => {
    'use strict'

    // Fetch all the forms we want to apply custom Bootstrap validation styles to
    const forms = document.querySelectorAll('.needs-validation')

    // Loop over them and prevent submission
    Array.from(forms).forEach(form => {
        form.addEventListener('submit', event => {
        if (!form.checkValidity()) {
            event.preventDefault()
            event.stopPropagation()
        }

        form.classList.add('was-validated')
        }, false)
    })
    })()
</script>
